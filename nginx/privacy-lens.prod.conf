# privacy-lens.prod.conf

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name api.privacy-lens.example.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name api.privacy-lens.example.com;

    # SSL certificate (replace with your actual cert and key)
    ssl_certificate     /etc/letsencrypt/live/api.privacy-lens.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.privacy-lens.example.com/privkey.pem;

    # --- CORS configuration for PrivacyLens API (prod) ---
    add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Proxy all API traffic to the Node.js backend (monolith for now)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Future: Route /api/ to client API process
    # location /api/ {
    #     proxy_pass http://client-api:PORT;
    # }

    # Future: Route /admin/ to admin dashboard process
    # location /admin/ {
    #     proxy_pass http://admin-dashboard:PORT;
    # }

    # Future: Route /api/v1/policies/ to archive API process
    # location /api/v1/policies/ {
    #     proxy_pass http://archive-api:PORT;
    # }

    # (Optional) Enable gzip compression
    # gzip on;
    # gzip_types text/plain application/json application/javascript text/css;

    access_log /var/log/nginx/privacy-lens.prod.access.log;
    error_log /var/log/nginx/privacy-lens.prod.error.log;
} 