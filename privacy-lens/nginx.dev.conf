# PrivacyLens Nginx Development Config
# Place this file at privacy-lens/nginx.dev.conf
#
# To use: copy or symlink to your nginx config location, or run nginx with -c <path>

worker_processes  1;

events { worker_connections  1024; }

http {
    include        /usr/local/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    server {
        listen 3000;

        # --- Plugin API ---
        location /api/public/assessments {
            proxy_pass http://localhost:3001/api/public/assessments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/assessments {
            proxy_pass http://localhost:3001/api/assessments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/version {
            proxy_pass http://localhost:3001/api/version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Client API ---
        location /api/auth/ {
            proxy_pass http://localhost:3000/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # (If you want /api/assessments to go to client-api instead, change the above block)

        # --- Archive API ---
        location /api/v1/policies/ {
            proxy_pass http://localhost:3003/api/v1/policies/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/auth/policies/ {
            proxy_pass http://localhost:3003/api/v1/auth/policies/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/version-archive {
            proxy_pass http://localhost:3003/api/version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Admin Dashboard ---
        location /admin/ {
            proxy_pass http://localhost:3002/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /login {
            proxy_pass http://localhost:3002/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /logout {
            proxy_pass http://localhost:3002/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /health-admin {
            proxy_pass http://localhost:3002/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # fallback for static files (admin-dashboard)
        location /static/ {
            proxy_pass http://localhost:3002/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Health Checks for All Services ---
        location /health-plugin {
            proxy_pass http://localhost:3001/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /health-client {
            proxy_pass http://localhost:3000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /health-archive {
            proxy_pass http://localhost:3003/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
} 