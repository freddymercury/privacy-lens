<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🕵️ Privacy Lens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🕵️ Privacy Lens</h1>
      </header>

      <div class="content">
        <div class="url-display">
          <h2>Current Website</h2>
          <p id="current-url">Loading...</p>
        </div>

        <div class="assessment">
          <h2>Privacy Assessment</h2>
          <div class="indicator">
            <div id="risk-indicator" class="unknown">?</div>
          </div>
          <p id="risk-text">Checking privacy status...</p>
        </div>

        <div class="details" id="assessment-details">
          <!-- Assessment details will be populated here -->
        </div>
        
        <div class="data-source" id="data-source-info">
          <!-- Data source information will be displayed here -->
        </div>
        
        <!-- Privacy policy link -->
        <div class="privacy-policy-link" id="privacy-policy-container" style="display: none;">
          <a href="#" id="privacy-policy-url" target="_blank" rel="noopener noreferrer">View Privacy Policy</a>
        </div>
      </div>

      <div class="settings">
        <button id="refresh-btn">Refresh Assessment</button>
        
        <!-- Server fetch button (only visible for paid tier) -->
        <div id="server-fetch-container" style="display: none;">
          <button id="server-fetch-btn">Fetch from Server</button>
        </div>
        
        <div class="toggle-container">
          <label for="active-toggle">Plugin Active</label>
          <label class="switch">
            <input type="checkbox" id="active-toggle" checked />
            <span class="slider round"></span>
          </label>
        </div>
        
        <!-- User tier indicator -->
        <div class="user-tier" id="user-tier-indicator">
          <span class="tier-badge free">Free Tier</span>
        </div>
        
        <!-- User menu -->
        <div class="user-menu">
          <div id="logged-out-menu">
            <button id="login-btn" class="menu-btn">Sign In</button>
          </div>
          
          <div id="logged-in-menu" style="display: none;">
            <div class="user-info">
              <span id="user-email">user@example.com</span>
            </div>
            <div class="menu-buttons">
              <button id="subscription-btn" class="menu-btn">Subscription</button>
              <button id="updates-btn" class="menu-btn">Updates</button>
              <button id="logout-btn" class="menu-btn">Sign Out</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
    
    <!-- Add CSS for new elements -->
    <style>
      #server-fetch-btn {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 8px 12px;
        margin: 8px 0;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      
      #server-fetch-btn:hover {
        background-color: #45a049;
      }
      
      #server-fetch-btn:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      
      .user-tier {
        margin-top: 10px;
        text-align: center;
      }
      
      .tier-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
      }
      
      .tier-badge.free {
        background-color: #e0e0e0;
        color: #666;
      }
      
      .tier-badge.paid {
        background-color: #4CAF50;
        color: white;
      }
      
      .data-source {
        margin-top: 10px;
        font-size: 12px;
        color: #666;
        font-style: italic;
      }
      
      /* User menu styles */
      .user-menu {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #e0e0e0;
      }
      
      .user-info {
        margin-bottom: 10px;
        text-align: center;
        font-size: 14px;
        color: #333;
        font-weight: 500;
      }
      
      .menu-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      
      .menu-btn {
        background-color: #f1f3f4;
        color: #333;
        border: none;
        padding: 8px 12px;
        margin: 4px 2px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        flex: 1;
        min-width: 80px;
        transition: background-color 0.2s;
      }
      
      .menu-btn:hover {
        background-color: #e0e0e0;
      }
      
      #login-btn {
        background-color: #4285f4;
        color: white;
        width: 100%;
        padding: 10px;
        font-weight: 500;
      }
      
      #login-btn:hover {
        background-color: #3367d6;
      }
      
      #logout-btn {
        background-color: #f1f3f4;
        color: #d93025;
      }
      
      #logout-btn:hover {
        background-color: #fce8e6;
      }
    </style>
  </body>
</html>
