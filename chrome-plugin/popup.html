<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivacyGuard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>PrivacyGuard</h1>
      </header>

      <div class="content">
        <div class="url-display">
          <h2>Current Website</h2>
          <p id="current-url">Loading...</p>
        </div>

        <div class="assessment">
          <h2>Privacy Assessment</h2>
          <div class="indicator">
            <div id="risk-indicator" class="unknown">?</div>
          </div>
          <p id="risk-text">Checking privacy status...</p>
        </div>

        <div class="details" id="assessment-details">
          <!-- Assessment details will be populated here -->
        </div>
        
        <div class="data-source" id="data-source-info">
          <!-- Data source information will be displayed here -->
        </div>
        
        <!-- Privacy policy link -->
        <div class="privacy-policy-link" id="privacy-policy-container" style="display: none;">
          <a href="#" id="privacy-policy-url" target="_blank" rel="noopener noreferrer">View Privacy Policy</a>
        </div>
      </div>

      <div class="settings">
        <button id="refresh-btn">Refresh Assessment</button>
        
        <!-- Server fetch button (only visible for paid tier) -->
        <div id="server-fetch-container" style="display: none;">
          <button id="server-fetch-btn">Fetch from Server</button>
        </div>
        
        <div class="toggle-container">
          <label for="active-toggle">Plugin Active</label>
          <label class="switch">
            <input type="checkbox" id="active-toggle" checked />
            <span class="slider round"></span>
          </label>
        </div>
        
        <!-- User tier indicator -->
        <div class="user-tier" id="user-tier-indicator">
          <span class="tier-badge free">Free Tier</span>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
    
    <!-- Add CSS for new elements -->
    <style>
      #server-fetch-btn {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 8px 12px;
        margin: 8px 0;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      
      #server-fetch-btn:hover {
        background-color: #45a049;
      }
      
      #server-fetch-btn:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      
      .user-tier {
        margin-top: 10px;
        text-align: center;
      }
      
      .tier-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
      }
      
      .tier-badge.free {
        background-color: #e0e0e0;
        color: #666;
      }
      
      .tier-badge.paid {
        background-color: #4CAF50;
        color: white;
      }
      
      .data-source {
        margin-top: 10px;
        font-size: 12px;
        color: #666;
        font-style: italic;
      }
    </style>
  </body>
</html>
