<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyLens - Login</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 350px;
      min-height: 400px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo img {
      width: 120px;
      height: auto;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    .btn {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      margin-top: 10px;
    }
    
    .btn:hover {
      background-color: #3367d6;
    }
    
    .btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    
    .error-message {
      color: #d93025;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    
    .success-message {
      color: #0f9d58;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    
    .form-toggle {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    
    .form-toggle a {
      color: #4285f4;
      text-decoration: none;
      cursor: pointer;
    }
    
    .form-toggle a:hover {
      text-decoration: underline;
    }
    
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    
    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 2s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="icons/icon16.svg" alt="PrivacyLens Logo">
      <h2>PrivacyLens</h2>
    </div>
    
    <!-- Login Form -->
    <div id="login-form">
      <h3>Sign In</h3>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>
      <button id="login-button" class="btn">Sign In</button>
      <div id="login-error" class="error-message"></div>
      <div class="form-toggle">
        Don't have an account? <a id="show-register">Sign Up</a>
      </div>
    </div>
    
    <!-- Register Form -->
    <div id="register-form" style="display: none;">
      <h3>Create Account</h3>
      <div class="form-group">
        <label for="register-name">Name</label>
        <input type="text" id="register-name" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" placeholder="Create a password">
      </div>
      <div class="form-group">
        <label for="register-confirm-password">Confirm Password</label>
        <input type="password" id="register-confirm-password" placeholder="Confirm your password">
      </div>
      <button id="register-button" class="btn">Sign Up</button>
      <div id="register-error" class="error-message"></div>
      <div id="register-success" class="success-message"></div>
      <div class="form-toggle">
        Already have an account? <a id="show-login">Sign In</a>
      </div>
    </div>
    
    <!-- Loading Indicator -->
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>Please wait...</p>
    </div>
  </div>
  
  <script type="module" src="login.js"></script>
</body>
</html>
