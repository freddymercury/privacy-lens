name: Privacy Policy Archiver Job

# Run every 2 hours
on:
  schedule:
    # Cron syntax: minute hour day month weekday
    # This runs at minute 0 of every 2nd hour
    - cron: '0 */2 * * *'
  
  # Also allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      domain:
        description: 'Specific domain to archive (optional)'
        required: false
        type: string

jobs:
  archive-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent runaway jobs
    
    # Remove environment requirement - use repository secrets directly
    # environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --production
      
      - name: Debug - Check secrets availability
        run: |
          echo "Checking if secrets are available:"
          echo "SUPABASE_URL is: ${{ secrets.SUPABASE_URL != '' && 'SET' || 'NOT SET' }}"
          echo "SUPABASE_KEY is: ${{ secrets.SUPABASE_KEY != '' && 'SET' || 'NOT SET' }}"
          echo "SUPABASE_SERVICE_KEY is: ${{ secrets.SUPABASE_SERVICE_KEY != '' && 'SET' || 'NOT SET' }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          
      - name: Debug - Check file content
        working-directory: ./backend
        run: |
          echo "Checking which version of the script we have:"
          ls -la scripts/
          echo "Content of archiver script:"
          head -30 scripts/run-archiver.js | grep -n "import.*Crawl"
          echo "Git commit info:"
          git log --oneline -1
      
      - name: Run archiver job
        working-directory: ./backend
        env:
          # Database
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}  # Add anon key
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          
          # Storage
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          
          # Optional overrides
          SPECIFIC_DOMAIN: ${{ github.event.inputs.domain }}
          
          # Memory settings
          NODE_OPTIONS: '--max-old-space-size=4096'
          
          # Crawler settings
          CRAWL_MAX_DEPTH: '2'
          CRAWL_MAX_LINKS: '20'
          CRAWL_INCLUDE_PDFS: 'false'
          CRAWL_DELAY_MS: '500'
          
        run: |
          echo "🚀 Starting archiver job at $(date)"
          node --max-old-space-size=4096 scripts/run-archiver.js
          echo "✅ Archiver job completed at $(date)"
      
      - name: Upload logs as artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archiver-logs-${{ github.run_number }}
          path: backend/logs/
          retention-days: 7

  # Optional: Send notification on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: archive-policies
    if: failure()
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "⚠️ Privacy Lens Archiver Job Failed",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Archiver Job Failed*\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }]
            }'